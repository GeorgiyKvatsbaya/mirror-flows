name: Watch for a new BACI release

# BACI is released once a year (usually late January). The rebuild is heavy (2.4 GB, 270M rows)
# and runs locally with `make refresh-baci`; this job only opens an issue as a reminder.
on:
  schedule:
    - cron: "41 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Compare versions
        id: versions
        run: |
          json=$(uv run wta baci-version)
          echo "$json"
          echo "latest=$(echo "$json" | jq -r .latest)" >> "$GITHUB_OUTPUT"
          echo "ingested=$(echo "$json" | jq -r .ingested)" >> "$GITHUB_OUTPUT"
      - name: Open an issue
        if: steps.versions.outputs.latest != steps.versions.outputs.ingested
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          INGESTED: ${{ steps.versions.outputs.ingested }}
        run: |
          title="New BACI release V${LATEST}"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue already open."
            exit 0
          fi
          gh issue create --title "$title" --body "CEPII published BACI V${LATEST} (ingested: V${INGESTED}). Rebuild locally: \`make refresh-baci\`, check \`dbt build\`, then commit \`web/public/data\` and \`data/reference\`."
