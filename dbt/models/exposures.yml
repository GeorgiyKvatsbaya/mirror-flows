version: 2

exposures:
  - name: world_page
    label: World overview
    type: application
    maturity: high
    url: https://worldtradeatlas.vercel.app/en
    description: World map, world trade over time, product mix and top traders (world.json, meta.json).
    depends_on:
      - ref('mart_country_year')
      - ref('mart_product_year')
      - ref('mart_source_comparison')
      - ref('dim_country')
      - ref('dim_product')
    owner:
      name: Georgiy Kvatsbaya
      email: 69528494+GeorgiyKvatsbaya@users.noreply.github.com

  - name: country_page
    label: Country profile
    type: application
    maturity: high
    url: https://worldtradeatlas.vercel.app/en/country/GEO
    description: Exports and imports over time, partners, product mix, strongest products, concentration and IMF months (countries/{code}.json).
    depends_on:
      - ref('mart_country_year')
      - ref('mart_country_partner_year')
      - ref('mart_country_product_year')
      - ref('mart_trade_monthly')
    owner:
      name: Georgiy Kvatsbaya
      email: 69528494+GeorgiyKvatsbaya@users.noreply.github.com

  - name: pair_page
    label: Partner pair
    type: application
    maturity: medium
    url: https://worldtradeatlas.vercel.app/en/country/GEO/partner/TUR
    description: Trade between two countries in both directions, by chapter (pairs/{code}.json).
    depends_on:
      - ref('mart_country_partner_year')
      - ref('mart_pair_product_year')
      - ref('mart_trade_monthly')
    owner:
      name: Georgiy Kvatsbaya
      email: 69528494+GeorgiyKvatsbaya@users.noreply.github.com

  - name: product_page
    label: Product
    type: application
    maturity: high
    url: https://worldtradeatlas.vercel.app/en/product/0901
    description: World trade in one HS4 heading, its exporters and importers, and market shares (products/{hs4}.json).
    depends_on:
      - ref('mart_product_year')
      - ref('mart_country_product_year')
    owner:
      name: Georgiy Kvatsbaya
      email: 69528494+GeorgiyKvatsbaya@users.noreply.github.com
