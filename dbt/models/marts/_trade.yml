version: 2

models:
  - name: fct_trade_hs6
    description: >
      Full-detail fact: one row per year x exporter x importer x HS6 product (~270M rows),
      values in US dollars FOB. Incremental by year (delete+insert); see the model header.
      {{ doc('mirror_flows') }}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, exporter_code, importer_code, hs6]}
    columns:
      - name: year
        data_tests: [not_null]
      - name: exporter_code
        description: Exporting country entity.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: importer_code
        description: Importing country entity.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: hs6
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_product'), field: hs6}}
      - name: value_usd
        description: US dollars, FOB.
      - name: quantity_t
        description: Metric tons, when reported.

  - name: mart_country_year
    description: >
      One row per country x year: exports, imports, balance, growth, share of world exports,
      partner and product concentration ({{ doc('hhi') }}), and diversification (number of HS4
      products with {{ doc('rca') }}).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code]}
    columns:
      - name: year
        data_type: smallint
        data_tests: [not_null]
      - name: entity_code
        data_type: varchar
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: exports_usd
        data_type: double
      - name: imports_usd
        description: Imports valued FOB (see fob_cif).
        data_type: double
      - name: balance_usd
        data_type: double
      - name: trade_usd
        description: Exports + imports.
        data_type: double
      - name: exports_growth
        description: Change in exports vs the previous year (0.1 = +10%).
        data_type: double
      - name: imports_growth
        data_type: double
      - name: world_export_share
        description: Country's share of world exports (0..1).
        data_type: double
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1}}
      - name: export_partner_count
        data_type: integer
      - name: import_partner_count
        data_type: integer
      - name: export_partner_hhi
        description: Concentration of exports across partners (0..1).
        data_type: double
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}
      - name: export_product_count
        description: HS4 headings exported.
        data_type: integer
      - name: export_product_hhi
        description: Concentration of exports across HS4 headings (0..1).
        data_type: double
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}
      - name: rca_product_count
        description: HS4 headings with RCA >= 1 — a diversification measure.
        data_type: integer
      - name: top_export_partner
        data_type: varchar
      - name: top_import_partner
        data_type: varchar
      - name: top_export_hs4
        data_type: varchar

  - name: mart_country_partner_year
    description: One row per country x partner x year from the country's point of view.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code, partner_code]}
    columns:
      - name: export_share
        description: Partner's share of the country's exports.
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}
      - name: import_share
        description: Partner's share of the country's imports.
      - name: export_rank
        description: 1 = largest export destination that year.
      - name: import_rank
        description: 1 = largest source of imports that year.

  - name: mart_country_product_year
    description: One row per country x HS4 heading x year, with world market share and {{ doc('rca') }}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code, hs4]}
    columns:
      - name: export_share
        description: The heading's share of the country's exports.
      - name: world_market_share
        description: The country's share of world exports of the heading.
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}
      - name: rca
        description: Balassa RCA; null when the country exports nothing.

  - name: mart_product_year
    description: One row per HS4 heading x year — world trade, growth, exporter concentration, leaders.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, hs4]}
    columns:
      - name: year
        data_type: smallint
        data_tests: [not_null]
      - name: hs4
        data_type: varchar
        data_tests: [not_null]
      - name: world_usd
        description: World exports of the heading, US dollars.
        data_type: double
      - name: world_share
        description: The heading's share of all world trade.
        data_type: double
      - name: growth
        description: Change vs the previous year.
        data_type: double
      - name: exporter_count
        data_type: integer
      - name: exporter_hhi
        description: "{{ doc('hhi') }}"
        data_type: double
      - name: top_exporter
        data_type: varchar
      - name: top_exporter_share
        data_type: double
      - name: top_importer
        data_type: varchar
      - name: top_importer_share
        data_type: double

  - name: mart_source_comparison
    description: >
      BACI vs IMF annual exports per country on the overlap years (complete IMF years only).
      Differences are expected — {{ doc('mirror_flows') }} Re-export hubs report goods in transit
      as their own exports; BACI attributes them to the producing country.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code]}
    columns:
      - name: imf_vs_baci
        description: IMF exports relative to BACI (0.6 = IMF is 60% higher).

  - name: mart_country_partner_chapter_year
    description: >
      One row per country x partner x HS2 chapter x year from the country's point of view:
      exports to and imports from the partner by chapter. Powers the Country page cross-filter
      (click a market to see its chapters, click a chapter to see its markets).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code, partner_code, hs2]}
    columns:
      - name: entity_code
        data_tests:
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: partner_code
        data_tests:
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: chapter_share_of_partner
        description: The chapter's share of the country's exports to this partner.
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}
      - name: partner_share_of_chapter
        description: The partner's share of the country's exports in this chapter.
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}

  - name: mart_country_chapter_year
    description: One row per country x HS2 chapter x year — exports, imports, world market share. Powers the World page chapter filter.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, entity_code, hs2]}
    columns:
      - name: world_market_share
        description: The country's share of world exports of the chapter.
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, max_value: 1.000001}}

  - name: mart_route_product_year
    description: >
      Exporter -> importer trade by HS4 heading and year since 2015 (var routes_first_year).
      Incremental by year. Powers "where does this exporter send the product" (Product page) and
      the HS4 drill-down inside a chapter (Pair page).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [year, exporter_code, importer_code, hs4]}
    columns:
      - name: exporter_code
        data_tests:
          - relationships: {arguments: {to: ref('dim_country'), field: entity_code}}
      - name: value_usd
        description: US dollars, FOB.
