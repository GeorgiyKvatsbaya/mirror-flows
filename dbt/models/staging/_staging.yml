version: 2

models:
  - name: stg_baci__flows
    description: BACI flows renamed and converted to US dollars. Grain year x exporter x importer x HS6.
    columns:
      - name: year
        data_tests: [not_null]
      - name: exporter_code
        description: Exporter, BACI country code.
        data_tests: [not_null]
      - name: importer_code
        description: Importer, BACI country code.
        data_tests: [not_null]
      - name: hs6
        description: HS 1992 six-digit product code.
        data_tests: [not_null]
      - name: value_usd
        description: Trade value in US dollars, FOB.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
      - name: quantity_t
        description: Quantity in metric tons, when reported.

  - name: stg_baci__countries
    description: BACI country codes.
    columns:
      - name: baci_code
        data_tests: [unique, not_null]
      - name: iso3
        description: ISO3 as given by BACI (not unique — historical joint reporters reuse it).

  - name: stg_baci__products
    description: HS92 six-digit products shipped with BACI.
    columns:
      - name: hs6
        data_tests: [unique, not_null]

  - name: stg_hs__codes
    description: HS 1992 nomenclature, all levels.
    columns:
      - name: hs_code
        data_tests: [unique, not_null]
      - name: hs_level
        data_tests:
          - accepted_values: {arguments: {values: [2, 4, 6]}}

  - name: stg_worldbank__countries
    description: World Bank economies with region and income group (aggregates removed).
    columns:
      - name: iso3
        data_tests: [unique, not_null]

  - name: stg_imf__trade_monthly
    description: IMF IMTS monthly flows in long form, one row per reporter x flow x counterpart x month.
    config:
      tags: ["monthly"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [reporter_iso3, flow, counterpart_code, month]
    columns:
      - name: flow
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [export, import]}}
      - name: month
        data_tests: [not_null]
