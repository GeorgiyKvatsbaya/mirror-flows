[project]
name = "mirror-flows"
version = "0.1.0"
description = "Global trade flows (CEPII BACI + IMF IMTS) modelled with dbt + DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.6",
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "pyarrow==26.0.0",
  "requests==2.34.2",
  "shapely==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "sqlfluff==4.4.0", "sqlfluff-templater-dbt==4.4.0"]

[project.scripts]
mflows = "mflows.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest/mflows"]

[tool.ruff.lint.isort]
known-first-party = ["mflows"]
